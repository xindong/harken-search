name: Slack Notify

on:
  pull_request_target:
    types: [closed]
  issues:
    types: [opened]
  workflow_run:
    workflows: [Enable PR Auto-merge]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event_name == 'issues' || github.event.pull_request.merged == true ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check notify card renderer
        run: python scripts/tests/test_slack_notify.py -v
      - name: Check optional notification configuration
        id: configuration
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
        run: |
          if [[ -z "$SLACK_BOT_TOKEN" || -z "$SLACK_CHANNEL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "通知未配置：请填写仓库 Secret SLACK_BOT_TOKEN 和 Variable SLACK_CHANNEL。本次未发送通知。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Post notice to Slack
        if: steps.configuration.outputs.configured == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          GH_SLACK_MAP: ${{ vars.GH_SLACK_MAP }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_SENDER: ${{ github.event.sender.login }}
        run: python scripts/slack_notify.py

  preview:
    name: Preview only (no messages sent)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check notify card renderer
        run: python scripts/tests/test_slack_notify.py -v
      - name: Preview an example notification without credentials
        env:
          EVENT_NAME: pull_request_target
          PR_NUMBER: "0"
          PR_TITLE: "通知预览示例（不会发送）"
          PR_BODY: "PR 合并后，原频道会显示标题、作者、合入人员、摘要和链接。"
          PR_URL: https://github.com/${{ github.repository }}
          PR_AUTHOR: example-author
          PR_MERGED_BY: example-maintainer
        run: python scripts/slack_notify.py --dry-run
