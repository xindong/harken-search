name: Harken Search Checks

on:
  push:
    branches: [main, qa/current]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    name: Harken Search / checks
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Check public source, licenses, localization and update contracts
        run: python tools/run_public_checks.py
      - name: Generate third-party SBOM
        run: python tools/generate_third_party_sbom.py --output artifacts/third-party-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-compliance-${{ github.sha }}
          path: artifacts/third-party-sbom.cdx.json
          if-no-files-found: error

  windows-build:
    name: Harken Search / build and test
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - name: Configure a clean Windows build
        run: cmake -S . -B build/public -G "Visual Studio 17 2022" -A x64
      - name: Build product and delivery/input regression tests
        run: >-
          cmake --build build/public --config Debug --parallel 4 --target
          HarkenSearch HarkenSearchBootstrap TestUpdateManifest TestUpdateCheckService
          TestUpdateApplicationService TestUpdateCoordinator TestUpdateRuntime
          TestHarkenSearchBootstrapPlan TestUpdateDownloadManager TestUpdateStateStore
          TestUpdateHttpTransport TestUpdateHttpTransportPlatform TestUpdatePersistencePort
          TestUpdateCheckHttpsTransport TestUpdaterBaseVolume TestBootstrapExitExplanation
          TestUpdateFailureExplanation TestUpdateStaleError TestDetachedViewportInput
          TestLibraryStatisticsWorker TestActionButtonStyle
      - name: Run update delivery and detached input tests
        run: >-
          ctest --test-dir build/public -C Debug --no-tests=error --output-on-failure
          -R "^Test(Update(Manifest|CheckService|ApplicationService|Coordinator|Runtime|DownloadManager|StateStore|HttpTransport|PersistencePort|CheckHttpsTransport|FailureExplanation|StaleError)|HarkenSearchBootstrapPlan|UpdaterBaseVolume|BootstrapExitExplanation)(Platform|Boundary)?$|^DetachedViewportInput$|^LibraryStatisticsWorker$|^Test(DatabaseSwitchWorkerRuntimeBoundary|DatabaseSwitchBlockingOperationBoundary|SimilarSoundsWindowContract|ActionButtonStyle)$"
          --output-junit test-results.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-tests-${{ github.sha }}
          path: build/public/test-results.xml
          if-no-files-found: warn
