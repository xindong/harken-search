name: CV-0EC12D84 CLAP export (temporary)

on:
  push:
    branches: [task/CV-0EC12D84]
    paths:
      - .github/workflows/cv-0ec12d84-clap-export.yml
      - tools/export_similarity_model.py

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned CPU exporter
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.46.3 onnx==1.17.0 onnxruntime==1.20.1 numpy==1.26.4 scipy==1.14.1 soundfile==0.12.1
      - name: Export and verify pinned audio-only resources
        run: python tools/export_similarity_model.py --output "$RUNNER_TEMP/harken-clap"
      - name: Show exact resource hashes
        run: sha256sum "$RUNNER_TEMP/harken-clap/clap-audio.onnx" "$RUNNER_TEMP/harken-clap/clap-mel-filters.f64" "$RUNNER_TEMP/harken-clap/clap-window.f64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-verified-clap
          path: |
            ${{ runner.temp }}/harken-clap/clap-audio.onnx
            ${{ runner.temp }}/harken-clap/clap-mel-filters.f64
            ${{ runner.temp }}/harken-clap/clap-window.f64
            ${{ runner.temp }}/harken-clap/parity-audio.f32
            ${{ runner.temp }}/harken-clap/parity-mel.f32
            ${{ runner.temp }}/harken-clap/parity-embedding.f32
            ${{ runner.temp }}/harken-clap/export-report.json
          if-no-files-found: error
          retention-days: 7
