name: CV-0EC12D84 CLAP export (temporary)

on:
  push:
    branches: [task/CV-0EC12D84]
    paths:
      - .github/workflows/cv-0ec12d84-clap-export.yml
      - tools/export_similarity_model.py
      - tools/split_similarity_model_artifact.py

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned CPU exporter
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.46.3 onnx==1.17.0 onnxruntime==1.20.1 numpy==1.26.4 scipy==1.14.1 soundfile==0.12.1
      - name: Export and verify pinned audio-only resources
        run: python tools/export_similarity_model.py --output "${{ runner.temp }}/harken-clap"
      - name: Split verified payload for bounded downloads
        run: python tools/split_similarity_model_artifact.py --source "${{ runner.temp }}/harken-clap" --output "${{ runner.temp }}/clap-parts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-manifest
          path: ${{ runner.temp }}/clap-parts/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-00
          path: ${{ runner.temp }}/clap-parts/part-00.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-01
          path: ${{ runner.temp }}/clap-parts/part-01.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-02
          path: ${{ runner.temp }}/clap-parts/part-02.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-03
          path: ${{ runner.temp }}/clap-parts/part-03.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-04
          path: ${{ runner.temp }}/clap-parts/part-04.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-05
          path: ${{ runner.temp }}/clap-parts/part-05.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-06
          path: ${{ runner.temp }}/clap-parts/part-06.bin
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-0ec12d84-clap-part-07
          path: ${{ runner.temp }}/clap-parts/part-07.bin
          if-no-files-found: error
          retention-days: 7
